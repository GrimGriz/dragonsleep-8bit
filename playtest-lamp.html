<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playtest Lamp</title>
<style>
  :root { --bg:#f4ecdc; --ink:#2b2418; --dim:#7a6a52; --rule:#d8cbb2; --accent:#8b4a2b; --docket:#fbf5e8;
          --works:#2f6d8f; --broken:#8f2f1c; --tune:#b8892a; --unclear:#a8552a; --skip:#6b6b6b; }
  [data-theme="night"] { --bg:#1e1b16; --ink:#e6dcc8; --dim:#9a8e7a; --rule:#3a342b; --accent:#d69a6a; --docket:#26221b;
          --works:#7fb3d0; --broken:#e0704f; --tune:#d9ad4f; --unclear:#e09a6a; --skip:#a09a90; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); }
  body { font-family:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; font-size:18px; line-height:1.55; padding-bottom:5rem; }
  #bar { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--rule); padding:.45rem 1rem;
         display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; font:14px system-ui,sans-serif; color:var(--dim); }
  #bar button, #bar label.btn { background:none; border:1px solid var(--rule); color:var(--ink); padding:.25rem .6rem; border-radius:6px; cursor:pointer; font:inherit; }
  #bar button:hover, #bar label.btn:hover { border-color:var(--accent); }
  #bar button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  #bar input[type=file] { display:none; }
  #bar .sp { flex:1 1 auto; }
  #count b { color:var(--ink); }
  #meter { height:3px; background:var(--rule); position:sticky; top:0; }
  #page { max-width:46em; margin:0 auto; padding:1.2rem 1.2rem 3rem; }
  h1 { font-weight:normal; font-size:1.5em; margin:.6em 0 .3em; }
  h2 { font-weight:normal; font-size:1.2em; border-bottom:1px solid var(--rule); padding-bottom:.2em; margin:2em 0 .6em; display:flex; justify-content:space-between; gap:1em; align-items:baseline; }
  h2 small { font:13px system-ui,sans-serif; color:var(--dim); white-space:nowrap; }
  .intro { color:var(--dim); } .intro p { margin:0 0 .6em; }
  code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85em; background:var(--docket); padding:0 .25em; border-radius:3px; }
  a { color:var(--accent); }
  .who { font:14px system-ui,sans-serif; color:var(--dim); display:flex; gap:.6em; flex-wrap:wrap; align-items:center; margin:.8em 0 0; }
  .who input { font:inherit; color:var(--ink); background:var(--docket); border:1px solid var(--rule); border-radius:6px; padding:.25rem .5rem; }
  .item { background:var(--docket); border:1px solid var(--rule); border-left:4px solid var(--rule); border-radius:6px; padding:.65rem .8rem; margin:.6rem 0; }
  .item.v-works { border-left-color:var(--works); } .item.v-broken { border-left-color:var(--broken); }
  .item.v-hard, .item.v-easy { border-left-color:var(--tune); } .item.v-unclear { border-left-color:var(--unclear); } .item.v-skip { border-left-color:var(--skip); }
  .item.focus { outline:2px solid var(--accent); outline-offset:2px; }
  .claim { margin:0 0 .45rem; }
  .claim .id { font:12px ui-monospace,Menlo,Consolas,monospace; color:var(--dim); margin-right:.4em; }
  .chips { display:flex; flex-wrap:wrap; gap:.35rem; font:13px system-ui,sans-serif; }
  .chips button { background:none; border:1px solid var(--rule); color:var(--ink); border-radius:999px; padding:.2rem .65rem; cursor:pointer; font:inherit; min-height:30px; }
  .chips button:hover { border-color:var(--accent); }
  .chips button.on[data-v=works]   { background:var(--works);   border-color:var(--works);   color:var(--bg); }
  .chips button.on[data-v=broken]  { background:var(--broken);  border-color:var(--broken);  color:var(--bg); }
  .chips button.on[data-v=hard], .chips button.on[data-v=easy] { background:var(--tune); border-color:var(--tune); color:var(--bg); }
  .chips button.on[data-v=unclear] { background:var(--unclear); border-color:var(--unclear); color:var(--bg); }
  .chips button.on[data-v=skip]    { background:var(--skip);    border-color:var(--skip);    color:var(--bg); }
  textarea { width:100%; margin-top:.45rem; font:15px/1.45 Georgia,serif; color:var(--ink); background:var(--bg); border:1px solid var(--rule); border-radius:6px; padding:.4rem .55rem; resize:vertical; min-height:2.2em; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .stale { font:12px system-ui,sans-serif; color:var(--unclear); margin-top:.3rem; }
  .secnote textarea { background:var(--docket); }
  .secnote label, .final label { font:13px system-ui,sans-serif; color:var(--dim); }
  body.unmarked-only .item.marked { display:none; }
  #toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:var(--ink); color:var(--bg); font:14px system-ui,sans-serif; padding:.45rem .9rem; border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  .legend { font:13px system-ui,sans-serif; color:var(--dim); margin:.6em 0 0; }
  @media (max-width:560px) { body { font-size:17px; } #page { padding:1rem 1rem 3rem; } #bar { padding:.4rem .6rem; } }
</style>
</head>
<body>
<div id="bar">
  <span id="count"></span>
  <span class="sp"></span>
  <button id="next" title="Jump to the next item with no mark">Next unmarked</button>
  <button id="filter" title="Hide marked items">Unmarked only</button>
  <button id="save" title="Download the feedback as a JSON ear-file">Save ear-file ⬇</button>
  <label class="btn" title="Load a saved ear-file back in">Load ⬆<input type="file" id="load" accept=".json,application/json"></label>
  <button id="md" title="Copy the checklist with your marks as markdown">Copy markdown</button>
  <button id="theme">Night</button>
  <button id="clear" title="Wipe every mark and note on this device">Clear</button>
</div>
<div id="meter"><div id="fill" style="height:3px;width:0;background:var(--accent)"></div></div>
<main id="page"></main>
<div id="toast"></div>
<script>
const DATA = {"title": "DRAGONSLEEP — playtest checklist", "intro": ["Live: <a href=\"https://grimgriz.github.io/dragonsleep-8bit/\" target=\"_blank\" rel=\"noopener\">https://grimgriz.github.io/dragonsleep-8bit/</a> · Z/Enter = use · X/Esc = menu/back · arrows/WASD = walk", "Tested so far only by bots (49 battles, every scripted scene) and a map-reachability checker. <b>Nobody has played it start to finish.</b> Mark anything that feels wrong, too hard, too easy, or unclear."], "sections": [{"n": "1", "title": "Start and town", "items": [{"id": "s1-1", "text": "Title → New Game → try each of the four leads once (intro text reads right for each?)", "h": "5000412a", "html": "Title → New Game → try each of the four leads once (intro text reads right for each?)"}, {"id": "s1-2", "text": "Silverton: walk every street; doors open shops/keepers when you walk in; you're stepped back out after", "h": "3467219d", "html": "Silverton: walk every street; doors open shops/keepers when you walk in; you're stepped back out after"}, {"id": "s1-3", "text": "Weigh-House (Hessle) reads the bounty board; the vault door sign; vice row booths", "h": "d4dede66", "html": "Weigh-House (Hessle) reads the bounty board; the vault door sign; vice row booths"}, {"id": "s1-4", "text": "Shops: buy/sell, equip-now prompt, ▲▼ markers make sense; the silver economy feels fair", "h": "92a97821", "html": "Shops: buy/sell, equip-now prompt, ▲▼ markers make sense; the silver economy feels fair"}, {"id": "s1-5", "text": "Inn (Cassia, 8 sp each) and Aldwin's free chapel floor both rest + offer save", "h": "cdfdbff0", "html": "Inn (Cassia, 8 sp each) and Aldwin's free chapel floor both rest + offer save"}, {"id": "s1-6", "text": "Leech-house revives KO'd heroes for 5 sp each", "h": "88960670", "html": "Leech-house revives KO'd heroes for 5 sp each"}, {"id": "s1-7", "text": "Field menu: ITEM / MAGIC / SKILL / EQUIP / STATUS / ORDER / JOURNAL / SAVE / OPTIONS all work", "h": "a4c072c5", "html": "Field menu: ITEM / MAGIC / SKILL / EQUIP / STATUS / ORDER / JOURNAL / SAVE / OPTIONS all work"}, {"id": "s1-8", "text": "Save to a slot, quit to title, CONTINUE loads it back correctly", "h": "08d40412", "html": "Save to a slot, quit to title, CONTINUE loads it back correctly"}]}, {"n": "2", "title": "Hires", "items": [{"id": "s2-1", "text": "Barley at the Hex bar (front 5 sp) · Aurdin outside the chapel (20 sp) · Vivian on vice row (buy a candle) · Lymen in the Hex (needs renown 1)", "h": "6ae59b2f", "html": "Barley at the Hex bar (front 5 sp) · Aurdin outside the chapel (20 sp) · Vivian on vice row (buy a candle) · Lymen in the Hex (needs renown 1)"}, {"id": "s2-2", "text": "Hires join at the right level (main − 1, min 2); they vanish from the map once hired", "h": "565b1d1f", "html": "Hires join at the right level (main − 1, min 2); they vanish from the map once hired"}, {"id": "s2-3", "text": "Journal \"Company\" quest points you to them clearly enough?", "h": "65a12b82", "html": "Journal \"Company\" quest points you to them clearly enough?"}]}, {"n": "3", "title": "Battle feel (the big one)", "items": [{"id": "s3-1", "text": "Solo start at level 2 in the fields north of town: survivable? Too grindy? (Aurdin solo is the hardest lead)", "h": "6ea5495e", "html": "Solo start at level 2 in the fields north of town: survivable? Too grindy? (Aurdin solo is the hardest lead)"}, {"id": "s3-2", "text": "Encounter rate: too often / too rare? Roads are half-rate", "h": "3ad33880", "html": "Encounter rate: too often / too rare? Roads are half-rate"}, {"id": "s3-3", "text": "FIGHT / MAGIC / SKILL / ITEM / RUN; target picking; turn order readable", "h": "704baab2", "html": "FIGHT / MAGIC / SKILL / ITEM / RUN; target picking; turn order readable"}, {"id": "s3-4", "text": "Barley: Second Wind (bonus), Action Surge (extra action), GWF · Vivian: HIDE, Sneak Attack · Lymen: Lay on Hands (heal / cure poison), Divine Smite in MAGIC, Sacred Weapon at 3 · Aurdin: Sleep, Burning Hands, Magic Missile, Shield; Arcane Recovery in the field", "h": "6aa61379", "html": "Barley: Second Wind (bonus), Action Surge (extra action), GWF · Vivian: HIDE, Sneak Attack · Lymen: Lay on Hands (heal / cure poison), Divine Smite in MAGIC, Sacred Weapon at 3 · Aurdin: Sleep, Burning Hands, Magic Missile, Shield; Arcane Recovery in the field"}, {"id": "s3-5", "text": "Level-ups (auto spell picks) feel right; cap at 5", "h": "e85ad23c", "html": "Level-ups (auto spell picks) feel right; cap at 5"}, {"id": "s3-6", "text": "KO → healer's kit revives in battle; whole party down → Game Over screen", "h": "c511cab4", "html": "KO → healer's kit revives in battle; whole party down → Game Over screen"}]}, {"n": "4", "title": "The Hex card", "items": [{"id": "s4-1", "text": "Korvin at the slate: brawl → freeman → hired blade → Talmok → festival", "h": "88c395fb", "html": "Korvin at the slate: brawl → freeman → hired blade → Talmok → festival"}, {"id": "s4-2", "text": "Solo bouts; losing = stitched up at 1 HP, no game over; crowd fronts your 5 if broke", "h": "c58ade8b", "html": "Solo bouts; losing = stitched up at 1 HP, no game over; crowd fronts your 5 if broke"}, {"id": "s4-3", "text": "Is Talmok beatable around level 3–4?", "h": "5c800ff5", "html": "Is Talmok beatable around level 3–4?"}]}, {"n": "5", "title": "The Crawler Warrens (east, across the bridge)", "items": [{"id": "s5-1", "text": "Edric at the tally-house puts you in the book; work a shift at a pen (milking); Old Hob's line", "h": "83ba4697", "html": "Edric at the tally-house puts you in the book; work a shift at a pen (milking); Old Hob's line"}, {"id": "s5-2", "text": "Skarn: talk \"as a man\" → his gate opens (walk into it)", "h": "14116002", "html": "Skarn: talk \"as a man\" → his gate opens (walk into it)"}, {"id": "s5-3", "text": "Mouths 1 & 6 → abandoned workings (rope + caches); night crews sometimes vanish instead of fighting", "h": "201eacfa", "html": "Mouths 1 &amp; 6 → abandoned workings (rope + caches); night crews sometimes vanish instead of fighting"}, {"id": "s5-4", "text": "The wet: bucket → feed the otyugh (or fight it — should be brutal); jelly splits on slashing; gray ooze", "h": "4be7f823", "html": "The wet: bucket → feed the otyugh (or fight it — should be brutal); jelly splits on slashing; gray ooze"}, {"id": "s5-5", "text": "The landing: the mark, the flooded stair — rope them out (safe) vs touch the mark / wade in (the Keeper fight)", "h": "cf1ff1af", "html": "The landing: the mark, the flooded stair — rope them out (safe) vs touch the mark / wade in (the Keeper fight)"}, {"id": "s5-6", "text": "Bring the five's gear to Edric; Skarn pays; renown + milestone XP + magic weapons", "h": "252d6fc1", "html": "Bring the five's gear to Edric; Skarn pays; renown + milestone XP + magic weapons"}, {"id": "s5-7", "text": "Kill 6+ crawlers first → Dunmore's line holds the camp on your way back", "h": "da230e6e", "html": "Kill 6+ crawlers first → Dunmore's line holds the camp on your way back"}]}, {"n": "6", "title": "The guano mine (west, in the mountain)", "items": [{"id": "s6-1", "text": "Sabeth hires you; cull pay per head/darkmantle when you return", "h": "ae22f717", "html": "Sabeth hires you; cull pay per head/darkmantle when you return"}, {"id": "s6-2", "text": "Fire under the roost (G2/G3) breaks the one law → Sabeth and Ottilie turn cold", "h": "8533cb0e", "html": "Fire under the roost (G2/G3) breaks the one law → Sabeth and Ottilie turn cold"}, {"id": "s6-3", "text": "The rescue set-piece in the dens' side gallery; bad air; the pits drop you into G4", "h": "6218fd6b", "html": "The rescue set-piece in the dens' side gallery; bad air; the pits drop you into G4"}, {"id": "s6-4", "text": "The cloaker: Light/torch gives it disadvantage; running goes up the ladder; tail → Hessle's drawer shows the [GRIZ] stub", "h": "ad3290bf", "html": "The cloaker: Light/torch gives it disadvantage; running goes up the ladder; tail → Hessle's drawer shows the [GRIZ] stub"}]}, {"n": "7", "title": "The road south", "items": [{"id": "s7-1", "text": "Web Gulch dungeon: the snared traveler; the braiding ettercap → fangs → Hessle pays 50 gp", "h": "eb3fe870", "html": "Web Gulch dungeon: the snared traveler; the braiding ettercap → fangs → Hessle pays 50 gp"}, {"id": "s7-2", "text": "Glowseep bog, Gnoll Hills, the Verge encounters", "h": "7aab73c9", "html": "Glowseep bog, Gnoll Hills, the Verge encounters"}, {"id": "s7-3", "text": "The Snoot's challenge on the road south of the inn", "h": "8347ed42", "html": "The Snoot's challenge on the road south of the inn"}, {"id": "s7-4", "text": "Both expansion walls: top of the Doors road, the south edge → popup, Donate opens Ko-fi in a new tab, you're pushed back", "h": "4d482edc", "html": "Both expansion walls: top of the Doors road, the south edge → popup, Donate opens Ko-fi in a new tab, you're pushed back"}]}, {"n": "8", "title": "Winters and the lake (the capstone)", "items": [{"id": "s8-1", "text": "Winters: \"not ready\" until the main is level 4, then the Ring of Binding (+3 CON saves) and the equip prompt", "h": "daa9c2d4", "html": "Winters: \"not ready\" until the main is level 4, then the Ring of Binding (+3 CON saves) and the equip prompt"}, {"id": "s8-2", "text": "Halfway Inn: Elsbeth at the dishes (talk more than once); the point by day; the rowboat pokes the deep (fight without the ring = should be very hard)", "h": "2c973526", "html": "Halfway Inn: Elsbeth at the dishes (talk more than once); the point by day; the rowboat pokes the deep (fight without the ring = should be very hard)"}, {"id": "s8-3", "text": "Sleep at the inn holding the ring → the cutscene (inn lady and kid walk out, only she comes back) → walk to the point", "h": "2cdad028", "html": "Sleep at the inn holding the ring → the cutscene (inn lady and kid walk out, only she comes back) → walk to the point"}, {"id": "s8-4", "text": "Chuul fight: \"The ring flares!\" on rounds 1/4/7/10, grapples + ESCAPE, poison → paralysis, Lay on Hands cure, never flees", "h": "4a7c9062", "html": "Chuul fight: \"The ring flares!\" on rounds 1/4/7/10, grapples + ESCAPE, poison → paralysis, Lay on Hands cure, never flees"}, {"id": "s8-5", "text": "Win → ending text ([GRIZ] on the inn's fate) → credits → title", "h": "a6d6d6fb", "html": "Win → ending text ([GRIZ] on the inn's fate) → credits → title"}]}, {"n": "9", "title": "Pacing and rewards", "items": [{"id": "s9-1", "text": "Main reaches level 4 at a reasonable point (renown gives 250 XP each)", "h": "0b3d06ba", "html": "Main reaches level 4 at a reasonable point (renown gives 250 XP each)"}, {"id": "s9-2", "text": "Magic weapons after each major quest (+1, then +2) — main and one hire", "h": "855d69aa", "html": "Magic weapons after each major quest (+1, then +2) — main and one hire"}, {"id": "s9-3", "text": "Anything that's a dead end, soft-lock, or \"what do I do now?\"", "h": "692718b4", "html": "Anything that's a dead end, soft-lock, or \"what do I do now?\""}]}, {"n": "10", "title": "Devices", "items": [{"id": "s10-1", "text": "Phone: touch d-pad + A/B/MENU, portrait and landscape", "h": "870bdd85", "html": "Phone: touch d-pad + A/B/MENU, portrait and landscape"}, {"id": "s10-2", "text": "Sound/music plays after the first keypress; volume in OPTIONS", "h": "9f8d6bca", "html": "Sound/music plays after the first keypress; volume in OPTIONS"}, {"id": "s10-3", "text": "Opening index.html straight from disk also works", "h": "d080b6a3", "html": "Opening index.html straight from disk also works"}]}, {"n": "11", "title": "Round two: the fold from the 09-24 ear-file", "items": [{"id": "s11-1", "text": "North gate: the cut up the mountain at the west end of Fountain Street → the Doors road → the expansion wall at the top. Walking back down drops you at the north gate (south road → south gate)", "h": "4adab059", "html": "North gate: the cut up the mountain at the west end of Fountain Street → the Doors road → the expansion wall at the top. Walking back down drops you at (function(){
  const KEY='dsl-playtest-lamp:v1', root=document.documentElement, body=document.body, page=document.getElementById('page');
  const G=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, P=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, D=k=>{try{localStorage.removeItem(k)}catch(e){}};

  const persist=()=>P(KEY,JSON.stringify(S));
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const toast=m=>{const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800);};

  // render
  let h='<h1>'+esc(DATA.title||'Playtest')+'</h1><div class="intro">'+DATA.intro.map(p=>'<p>'+p+'</p>').join('')+'</div>';
  h+='<div class="who"><label>Tester <input id="tester" placeholder="your name" size="16"></label><span>checklist <code>'+esc(DATA.src_sha1)+'</code></span></div>';
  h+='<p class="legend">Mark each line as you go; add a note wherever something felt off. Everything saves on this device as you type. <b>Save ear-file ⬇</b> downloads it to hand back.</p>';
  DATA.sections.forEach(s=>{
    h+='<h2 id="sec-'+s.n+'"><span>'+esc(s.n)+'. '+esc(s.title)+'</span><small data-sc="'+s.n+'"></small></h2>';
    s.items.forEach(it=>{
      h+='<div class="item" id="'+it.id+'" data-id="'+it.id+'"><p class="claim"><span class="id">'+it.id.slice(1)+'</span>'+it.html+'</p><div class="chips">'+
        VERDICTS.map(([v,l])=>'<button type="button" data-v="'+v+'">'+l+'</button>').join('')+
        '</div><textarea rows="1" placeholder="note (optional)"></textarea><div class="stale" hidden>This note was written against older wording of this line.</div></div>';

  });
  h+='<h2><span>Notes</span></h2><div class="final"><label>Overall — dead ends, soft-locks, "what do I do now?", anything the list missed</label><textarea id="notes" rows="5"></textarea></div>';
  page.innerHTML=h;

  const grow=ta=>{ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px';};
  function paint(it){
    const el=document.getElementById(it.id), r=S.items[it.id]||{};
    el.className='item'+(r.v?' marked v-'+r.v:'');
    el.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b.dataset.v===r.v));
    const ta=el.querySelector('textarea'); if(ta.value!==(r.note||'')) ta.value=r.note||''; grow(ta);
    el.querySelector('.stale').hidden=!(r.h&&r.h!==it.h&&(r.v||r.note));
  }
  function counts(){
    const n=ITEMS.length, m=ITEMS.filter(i=>(S.items[i.id]||{}).v).length;
    const c={}; ITEMS.forEach(i=>{const v=(S.items[i.id]||{}).v; if(v) c[v]=(c[v]||0)+1;});
    let t='<b>'+m+'</b>/'+n+' marked'; if(c.broken) t+=' · '+c.broken+' broken'; if(c.unclear) t+=' · '+c.unclear+' unclear'; if((c.hard||0)+(c.easy||0)) t+=' · '+((c.hard||0)+(c.easy||0))+' tuning';
    document.getElementById('count').innerHTML=t; document.getElementById('fill').style.width=(n?100*m/n:0)+'%';
    DATA.sections.forEach(s=>{const k=s.items.filter(i=>(S.items[i.id]||{}).v).length; document.querySelector('[data-sc="'+s.n+'"]').textContent=k+'/'+s.items.length;});
    return {n,m,c};
  }
  function paintAll(){
    ITEMS.forEach(paint);

    const nt=document.getElementById('notes'); nt.value=S.notes||''; grow(nt);
    document.getElementById('tester').value=S.tester||''; counts();
  }
  const stampNow=()=>new Date().toISOString().replace(/\.\d+Z$/,'Z');
  const rec=id=>{const it=BYID[id]; const r=S.items[id]||(S.items[id]={}); r.h=it.h; return r;};

  page.addEventListener('click',e=>{
    const b=e.target.closest('.chips button'); if(!b) return;
    const id=b.closest('.item').dataset.id, r=rec(id);

  });

  // bar

  if(G('dsl-playtest-lamp:theme')==='night'){root.dataset.theme='night'; th.textContent='Day';}
  th.onclick=()=>{const n=root.dataset.theme==='night'; if(n){delete root.dataset.theme; th.textContent='Night'; P('dsl-playtest-lamp:theme','day');} else {root.dataset.theme='night'; th.textContent='Day'; P('dsl-playtest-lamp:theme','night');}};
  const fb=document.getElementById('filter');
  fb.onclick=()=>{body.classList.toggle('unmarked-only'); fb.classList.toggle('on');};
  document.getElementById('next').onclick=()=>{
    const y=window.scrollY+90, live=i=>!(S.items[i.id]||{}).v;
    const pick=ITEMS.find(i=>live(i)&&document.getElementById(i.id).getBoundingClientRect().top+window.scrollY>y)||ITEMS.find(live);
    if(!pick){toast('Every line is marked.'); return;}
    page.querySelectorAll('.item.focus').forEach(x=>x.classList.remove('focus'));
    const el=document.getElementById(pick.id); el.classList.add('focus'); el.scrollIntoView({block:'center',behavior:'smooth'});
  };
  function dl(name,text,type){const b=new Blob([text],{type:type||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);}
  const day=()=>new Date().toISOString().slice(0,10);
  document.getElementById('save').onclick=()=>{
    const {n,m,c}=counts();
    const out={_readme:{what:'Playtest feedback — the DRAGONSLEEP playtest lamp, one verdict per checklist line.',
        fold_back:'Whoever takes this (Cowork seat or code tab): broken and unclear lines become the fix list; too hard / too easy are tuning; notes are the tester\'s words, verbatim. Load this file back into the lamp to keep going.',
        verdicts:VLABEL},
      lamp:'playtest-lamp', checklist_sha1:DATA.src_sha1, tester:S.tester, saved_at:stampNow(),
      counts:Object.assign({lines:n,marked:m},c),
      items:ITEMS.filter(i=>S.items[i.id]).map(i=>{const r=S.items[i.id]; return {id:i.id, section:i.sec.n+'. '+i.sec.title, claim:i.text, verdict:r.v||'', note:r.note||'', at:r.at||'', text_changed:!!(r.h&&r.h!==i.h)};}),
      section_notes:Object.fromEntries(DATA.sections.filter(s=>(S.secnotes[s.n]||'').trim()).map(s=>[s.n+'. '+s.title,S.secnotes[s.n]])),
      notes:S.notes};
    dl('playtest-ear-file-'+day()+(S.tester?'-'+S.tester.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-'):'')+'.json',JSON.stringify(out,null,2),'application/json');
    toast('Ear-file saved.');
  };
  document.getElementById('load').onchange=e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{
      const j=JSON.parse(r.result); let k=0, miss=0;
      (j.items||[]).forEach(x=>{ const it=BYID[x.id]; if(!it){miss++; return;}
        S.items[x.id]={v:x.verdict||'', note:x.note||'', at:x.at||'', h:(x.claim===it.text)?it.h:'changed'}; k++; });
      const secByTitle=Object.fromEntries(DATA.sections.map(s=>[s.n+'. '+s.title,s.n]));

    }catch(err){ toast('That file is not a playtest ear-file.'); } e.target.value=''; };

    DATA.sections.forEach(s=>{
      t+='\n## '+s.n+'. '+s.title+'\n';

})();
