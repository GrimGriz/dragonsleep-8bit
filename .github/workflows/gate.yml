# The gate on GitHub (10-06, the gate handoff §2.1; Griz: "Ask an Opus runner, totally not my wheelhouse" -- the runner's (a)):
# `python dev/check.py all` on a Linux runner after every push to main and to a cloud seat's claude/* branch, a green or red mark
# on the commit. It blocks nothing, and the push law on the desk (GREEN before a push) is unchanged. Since 2026-10-14 Pages deploys from
# the `live` branch (CLAUDE.md): main is the workshop, and a push to main no longer reaches players.
# A second witness: a clean checkout on another OS, the full gate every time, where the desk's quick gate runs before a push.
name: gate

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 75 # (30 till 2026-11-27: runs took 21 to 26 minutes and 100be857's was cut off at 30; Griz: "changing to 45 is fine this turn"; 75 the same night, the desk's, with the checks capped at two at once below: half as many at a time may take near twice as long)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (dev/keeper-probe.py reads the pinned ed7be2a with `git show`: a shallow clone reads RED)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # (10-31: dev/keeper-probe.py reads the Keeper's frames with Pillow, numpy and scipy since 6733f0cd, 10-30 07:48Z -- the runner had none,
      # and 55 runs were RED on that import alone; the desk's versions, pinned)
      - name: the probes' Python packages
      # (11-14: dev/snoot-headless-probe.py plays the Snoot's days over http with Playwright's Python, driving the gate's own browser)
        run: python -m pip install pillow==11.0.0 numpy==2.2.2 scipy==1.15.1 playwright==1.64.0

      - name: the browser
        run: |
          B=$(command -v microsoft-edge || command -v microsoft-edge-stable || command -v google-chrome || command -v chromium || true)
          if [ -z "$B" ]; then echo "no Chromium-family browser on the runner"; exit 1; fi
          echo "the gate's browser: $B ($("$B" --version))"
          echo "DEEP16_BROWSER=$B" >> "$GITHUB_ENV"

      - name: python dev/check.py all
        env:
          DEEP16_BROWSER_ARGS: --no-sandbox
          # (two checks at once here, four at the desk: 2026-11-27, Griz, "assume you're right and cap how many checks run at once on github" -- two runs were
          # killed with exit 143 a few minutes in, no check answered; dev/check.py reads it)
          DEEP16_GATE_JOBS: '2'
        run: python dev/check.py all
