<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Snoot -- DRAGONSLEEP</title>
<!-- THE SNOOT (10-14, the Snoot mode seat): the Snoot at Tarlyn's Pit as a turn-taking hex war, for the Chef to play.
     Its own folder and door (the lean RULED 10-13; the desk ships this folder to `live` alone): from the shared tree it reads
     only ../deep16/data/sprites.js and ../deep16/art/ (the sheets) and opens ../deep16/index.html?embed for the party's fights.
     The lane: they live\handoff-2026-10-13-the-snoot-mode.md. The rules as read: rules-source.md beside this page.
     The door is the Chef's test (his word 10-14 night, by the desk: "let the snoot know to edit the door to the chef's test").
     Doors: (none) the game · ?seed=N a battle by its dice · ?fresh a new battle, the saved one left alone · ?watch both sides
     played by the AI · ?probe the gate's checks (dev/snoot-probe.py) -->
<style>
  :root { --ink: #e8d8a0; --dim: #9a94a8; --bg: #120f17; --panel: #1d1824ee; --line: #4a3f5c; --ours: #4fb3a0; --gnoll: #d9734e; --dom: #a07ad6; --warn: #f0c060; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, 'Times New Roman', serif; overflow: hidden; }
  #app { position: relative; width: 100vw; height: 100vh; }
  #map { position: absolute; left: 0; top: 40px; image-rendering: pixelated; cursor: pointer; }
  #top { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #0c0a10; border-bottom: 1px solid var(--line); z-index: 5; }
  #top .t { font-size: 18px; letter-spacing: 2px; }
  #top .day { color: var(--warn); margin-left: 6px; }
  #top .sp { flex: 1; }
  button { font: inherit; color: var(--ink); background: #2a2233; border: 1px solid var(--line); border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #3a3046; }
  button.go { background: #3d5a2a; border-color: #6a9a48; font-weight: bold; }
  button.go:hover { background: #4d7036; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: #5a4a20; border-color: var(--warn); }
  #log { position: absolute; right: 0; top: 40px; bottom: 0; width: 340px; overflow-y: auto; padding: 8px 10px 40px; background: var(--panel); border-left: 1px solid var(--line); font-size: 12.5px; z-index: 4; }
  #log .l { margin: 2px 0; }
  #log .day { color: var(--warn); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 14px; }
  #log .roll { color: #c9c2d6; font-family: Consolas, monospace; font-size: 11.5px; }
  #log .witness { color: var(--gnoll); }
  #log .head { color: #ff8a8a; font-weight: bold; }
  #log .party { color: var(--ours); }
  #log .morale { color: #b8b0c8; font-style: italic; }
  #log .fight { color: var(--ink); margin-top: 6px; }
  #log .hunt, #log .dominion, #log .arrive { color: var(--warn); }
  #panel { position: absolute; left: 0; bottom: 0; height: 128px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); z-index: 4; display: flex; gap: 14px; align-items: flex-start; }
  #panel .who { min-width: 280px; }
  #panel .nm { font-size: 17px; }
  #panel .cls { color: var(--dim); font-size: 12.5px; }
  #panel .note { color: var(--dim); font-size: 12px; max-width: 420px; }
  #panel .orders { display: flex; flex-direction: column; gap: 6px; }
  #panel .orders div { display: flex; gap: 6px; flex-wrap: wrap; }
  #panel .tip { color: var(--dim); font-size: 12px; }
  .modal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000a; z-index: 20; }
  .modal.open { display: flex; }
  .card { background: #1d1824; border: 2px solid var(--line); border-radius: 8px; padding: 18px 22px; max-width: 640px; width: calc(100% - 32px); max-height: calc(100% - 40px); overflow-y: auto; box-shadow: 0 8px 40px #000; }
  .card h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 3px; }
  .card h2 { margin: 12px 0 4px; font-size: 16px; color: var(--warn); }
  .card p { margin: 6px 0; }
  .card .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .card table { border-collapse: collapse; font-size: 13px; }
  .card td { padding: 2px 10px 2px 0; }
  .card .small { color: var(--dim); font-size: 12.5px; }
  #notesBox textarea { width: 100%; min-height: 160px; background: #0f0c14; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; font: 14px/1.4 Georgia, serif; padding: 8px; }
  #notesBox .past { max-height: 160px; overflow-y: auto; font-size: 12.5px; margin: 6px 0; }
  #notesBox .past div { border-left: 2px solid var(--line); padding-left: 8px; margin: 4px 0; }
  #notesBox input { background: #0f0c14; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  #toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); background: #3d5a2a; padding: 6px 14px; border-radius: 4px; display: none; z-index: 40; }
  #d16 { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 30; background: #000; }
  #probe { white-space: pre; }
  #show { position: absolute; left: 0; top: 40px; display: none; z-index: 12; cursor: pointer; image-rendering: pixelated; }
  #tip { position: absolute; display: none; z-index: 8; max-width: 380px; background: #1d1824f2; border: 1px solid var(--warn); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; pointer-events: none; box-shadow: 0 4px 18px #000a; }
  #tip .h { color: var(--warn); font-weight: bold; margin-bottom: 3px; }
  #tip .w { color: #ff9a7a; }
  #tip div { margin: 2px 0; }
  @media (max-width: 900px) { #log { width: 240px; } #panel .who { min-width: 180px; } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="t">THE SNOOT</span><span class="day" id="dayLabel"></span>
    <span class="sp"></span>
    <span id="phase" class="small"></span>
    <button id="bNext" title="Next unit without orders (Tab)">NEXT UNIT</button>
    <button id="bResolve" class="go" title="Resolve the day (Enter)">RESOLVE THE DAY</button>
    <button id="bNotes" title="Your notes for Griz (N)">NOTES</button>
    <button id="bHelp" title="How it plays (H)">HOW IT PLAYS</button>
  </div>
  <canvas id="map"></canvas>
  <canvas id="show"></canvas>
  <div id="tip"></div>
  <div id="log"></div>
  <div id="panel"></div>
  <div class="modal" id="cardM"><div class="card" id="card"></div></div>
  <div class="modal" id="notesM"><div class="card" id="notesBox"></div></div>
  <div id="toast"></div>
</div>
<pre id="probe" hidden></pre>
<script src="../deep16/data/sprites.js"></script>
<script src="js/data.js?v=929df5beb9"></script>
<script src="js/party8.js?v=e6a0f37d96"></script>
<script src="js/rules.js?v=73bc35d445"></script>
<script src="js/ai.js?v=bb786527f1"></script>
<script src="js/show.js?v=9ca42bea7d"></script>
<script src="js/view.js?v=2052111b22"></script>
<script src="js/deep.js?v=c4a6164f52"></script>
<script src="js/notes.js?v=0de3ae997b"></script>
<script src="js/ui.js?v=1b46f99f61"></script>
<script src="js/probe.js?v=af55ffd9c0"></script>
<script>
  if (/[?&]probe\b/.test(location.search)) { var pr = document.getElementById('probe'); pr.hidden = false; try { pr.textContent = window.SN.probe().join('\n') + (window.SN.UI && window.SN.UI.probeUI ? '\n' + window.SN.UI.probeUI().join('\n') : ''); if (window.SN.UI.probeAsync) window.SN.UI.probeAsync(pr); } catch (e) { pr.textContent = 'FAIL the probe threw: ' + (e && e.stack || e); } }
</script>
</body>
</html>
