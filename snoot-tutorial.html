<title>The Snoot, explained</title>
<!-- THE SNOOT, EXPLAINED (10-15, the Snoot mode seat): a page for Griz's understanding, not the game -- his words: "can you create a tutorial that
     goes through the chain mail rules, how the units are made - what happens when they fight, with pauses for reading between steps"; "this is
     more for my understanding that something going in the game whole cloth - also demonstrate what we're doing different from the chainmail
     rules - like the gnoll snoot stuff and if the party wouldn't be grid-played"; "a simplified version will remain for the in game tutorial".
     It runs the mode's own engine (snoot-mode/js) on staged scenes with fixed seeds, so every die on screen is the engine's and the lesson
     plays the same each time. Each step pairs what CHAINMAIL says (with its page) and what the Snoot mode does. A dev page beside road-legs.html,
     linked from nothing. The STEPS list below is the one to cut from for the in-game tutorial. -->
<style>
  :root { --ink: #e8d8a0; --dim: #9a94a8; --bg: #120f17; --panel: #1d1824; --line: #4a3f5c; --cm: #d8c08a; --ours: #4fb3a0; --warn: #f0c060; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 Georgia, 'Times New Roman', serif; overflow: hidden; }
  #app { position: absolute; inset: 0; }
  #top { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #0c0a10; border-bottom: 1px solid var(--line); }
  #top .t { font-size: 17px; letter-spacing: 2px; }
  #top .ch { color: var(--warn); }
  #stage { position: absolute; left: 0; top: 40px; bottom: 0; right: 430px; }
  #map, #show { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
  #show { display: none; }
  #vis { position: absolute; inset: 0; overflow: auto; padding: 18px 22px; display: none; background: var(--bg); }
  #read { position: absolute; right: 0; top: 40px; bottom: 0; width: 430px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #body { flex: 1; overflow-y: auto; padding: 14px 18px; }
  #body h2 { margin: 0 0 8px; font-size: 21px; color: #ffe08a; }
  .box { border-radius: 6px; padding: 8px 11px; margin: 10px 0; font-size: 14px; }
  .box .lab { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; }
  .cm { background: #2a2418; border: 1px solid #6a5a34; } .cm .lab { color: var(--cm); }
  .ours { background: #15302b; border: 1px solid #2f7a6a; } .ours .lab { color: var(--ours); }
  .diff { background: #33201a; border: 1px solid #a85a3a; } .diff .lab { color: #ff9a7a; }
  .num { font-family: Consolas, monospace; font-size: 13px; color: #f3e7c0; }
  .k { color: #ffd25a; font-weight: bold; }
  #nav { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
  #nav .sp { flex: 1; text-align: center; color: var(--dim); font-size: 13px; }
  button { font: inherit; color: var(--ink); background: #2a2233; border: 1px solid var(--line); border-radius: 4px; padding: 5px 14px; cursor: pointer; }
  button:hover { background: #3a3046; } button.go { background: #3d5a2a; border-color: #6a9a48; font-weight: bold; } button:disabled { opacity: .4; cursor: default; }
  #dots { display: flex; flex-wrap: wrap; gap: 3px; padding: 6px 14px 0; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; background: #3a3046; cursor: pointer; } #dots i.on { background: #ffd25a; } #dots i.ch { outline: 1px solid #6a5a34; }
  table.cmp { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  table.cmp th { text-align: left; color: #ffe08a; border-bottom: 2px solid var(--line); padding: 6px 8px; position: sticky; top: 0; background: var(--bg); }
  table.cmp td { border-bottom: 1px solid #2c2536; padding: 6px 8px; vertical-align: top; }
  table.cmp td.p { color: var(--dim); white-space: nowrap; }
  table.cmp tr.same td.o { color: #9fe0c8; } table.cmp tr.chg td.o { color: #ffd28a; } table.cmp tr.new td.o { color: #ff9a7a; } table.cmp tr.out td.o { color: var(--dim); }
  .tag { font-size: 11px; border-radius: 3px; padding: 0 5px; margin-right: 4px; }
  .tag.same { background: #15302b; color: #9fe0c8; } .tag.chg { background: #3a2e14; color: #ffd28a; } .tag.new { background: #3a1e18; color: #ff9a7a; } .tag.out { background: #2a2433; color: var(--dim); }
  #d16 { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 30; background: #000; }
</style>

<body>
<div id="app">
  <div id="top"><span class="t">THE SNOOT, EXPLAINED</span><span class="ch" id="chap"></span><span style="flex:1"></span><span style="color:var(--dim);font-size:13px">&larr; &rarr; or the buttons &middot; nothing here is the game</span></div>
  <div id="stage"><canvas id="map"></canvas><canvas id="show"></canvas><div id="vis"></div></div>
  <div id="read"><div id="dots"></div><div id="body"></div><div id="nav"><button id="back">&larr; BACK</button><span class="sp" id="count"></span><button id="next" class="go">NEXT &rarr;</button></div></div>

<script>window.SN = window.SN || {}; window.SN.DEEP16 = 'deep16/';</script>
<script src="deep16/data/sprites.js"></script>
<script src="snoot-mode/js/data.js?v=9189ddaebe"></script>
<script src="snoot-mode/js/party8.js?v=edb32c7f51"></script>
<script src="snoot-mode/js/rules.js?v=57fa971dee"></script>
<script src="snoot-mode/js/ai.js?v=c8a08c5fa3"></script>
<script src="snoot-mode/js/view.js?v=7567bc33bb"></script>
<script src="snoot-mode/js/show.js?v=b02a6d44cf"></script>
<script src="snoot-mode/js/deep.js?v=08abb655fa"></script>
<script>
'use strict';
(function () {
  var SN = window.SN, V = SN.V, SH = SN.Show; SH.hint = false;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  var CN = SN.CLASSNAME;

  // ---------------------------------------------------------------- the staged scenes: the mode's own engine, a day run on a fixed seed
  function base(seed) { var st = SN.newGame(seed); st.party8 = null; st.units.forEach(function (u) { u.on = false; }); st.log = []; st.beats = []; return st; }
  function put(st, id, at) { var u = SN.unit(st, id); u.on = true; u.state = 'ok'; u.at = at.slice(); u.order = { type: 'hold' }; return u; }
  function march(st, u, to) { var p = SN.path(u.at, to); u.order = { type: 'move', to: to.slice(), path: SN.reach(u, p), full: p }; }
  function runDay(st) { var g = SN.resolve(st), r = g.next(), anim = null; while (!r.done) { var v = r.value; if (v && v.anim) anim = v.anim; r = g.next(v && v.deep ? SN.standIn(st, v.deep) : undefined); } return anim; }
  function clone(st) { return JSON.parse(JSON.stringify(st)); }
  function has(st, t, f) { return (st.beats || []).some(function (b) { return b.t === t && (!f || f(b)); }); }
  // a scene: the field before the day, the day's moves, the field after, and the shows of its fights; the seed is the first that shows what the step teaches
  function scene(build, want) {
    for (var seed = 1; seed < 900; seed++) {
      var st = build(seed), before = clone(st), anim = runDay(st);
      if (want(st)) return { seed: seed, before: before, after: st, anim: anim || [], shows: shows(st) };
    }
    return null;
  }
  function shows(st) {
    var B = st.beats, out = [];
    B.forEach(function (b, i) { if (b.t !== 'fight' && b.t !== 'head') return; var j = i + 1; while (j < B.length && B[j].t !== 'fight' && B[j].t !== 'head') j++; out.push(SH.build(st, i, j, b.at)); });
    return out;
  }
  // A: Newland's road patrol (a paladin with it) marches out of the Pit and charges the glory-seekers on the road: one round decides it
  var A = scene(function (s) { var st = base(s); var P = put(st, 'patrol', [9, 8]); put(st, 'sg1', [8, 6]); march(st, P, [8, 6]); return st; },
    function (st) { return has(st, 'atk', function (b) { return b.u === 'patrol' && b.imp; }) && has(st, 'cas', function (b) { return b.u === 'patrol'; }) && has(st, 'cas', function (b) { return b.u === 'sg1'; }) && has(st, 'mor', function (b) { return b.lo === 'theirs' && (b.how === 'back' || b.how === 'backoff' || b.how === 'retreat'); }); });
  // W: a Skull-Gate band falls on a company of Newland's crossbows; it wins, takes a loss, and the band two hexes off sends men over (his witness)
  var W = scene(function (s) { var st = base(s); var cb = put(st, 'bat2', [8, 5]); cb.figs = cb.figs0 = 10; cb.name = 'a company of Newland\'s crossbows'; var a = put(st, 'sg2', [7, 4]); a.name = 'the Skull-Gate band in the fight'; put(st, 'sg1', [7, 3]).name = 'the Skull-Gate band two hexes off'; march(st, a, [8, 5]); return st; },
    function (st) { return has(st, 'wit') && has(st, 'cas', function (b) { return b.u === 'sg2'; }); });
  // the four keyed by Book I's Fighting Capability (p.17; RULED 10-15, Griz: "Yes, key the four by Book I in the tutorial chapter")
  var KEYS = [
    { name: 'Barley', type: 'superhero', is: 'fighter 8', key: 'Fighting-Man, 8th: the Superhero' },
    { name: 'Lymen', type: 'superhero', is: 'paladin 8', key: 'Fighting-Man, 8th: the Superhero (no paladin in Books I-III: keyed as the fighter he is)' },
    { name: 'Aurdin', type: 'hero', missile: 'fireball', is: 'wizard 8, an evoker', key: 'Magic-User, 8th: the Warlock, who fights as a Hero' },
    { name: 'Vivian', type: 'hero', is: 'rogue 8', key: 'no thief in Books I-III: a Hero (Griz, 10-15)' }];
  var KEYFIGS = KEYS.reduce(function (s, k) { return s + { hero: 4, superhero: 8 }[k.type]; }, 0);
  // P: the four as CHAINMAIL would field them, keyed by Book I -- on the tables, not the grid -- charging a Gray Keeping band
  var P = scene(function (s) {
      var st = base(s); put(st, 'gk1', [8, 6]);
      var f = SN.make({ id: 'four', side: 'ours', name: 'the four (on the tables)', kind: 'the four', cls: 'AF', def: 'AF', figs: 0, at: [9, 7], move: 3,
        heroes: KEYS.map(function (k) { return { type: k.type, name: k.name, missile: k.missile }; }), sheets: ['barley_p1', 'lymen_p1', 'aurdin_p1', 'vivian_p1'] }, true);
      st.units.push(f); march(st, f, [8, 6]); return st; },
    function (st) { return has(st, 'shock', function (b) { return b.ok; }) && has(st, 'atk', function (b) { return b.u === 'four'; }) && has(st, 'fb', function (b) { return b.u === 'four'; }); });
  // H: the hunt -- the Harbinger walks through the crossbows (a cleric, but no hero with them) and reaches GreyFang with no one of ours near: the head on the map
  var H = scene(function (s) { var st = base(s); st.huntDay = 14; put(st, 'bat2', [8, 7]).name = 'a company of Newland\'s crossbows'; put(st, 'greyfang', [9, 8]); var h = put(st, 'harb', [7, 6]); march(st, h, [9, 8]); return st; },
    function (st) { return !!st.head && st.log.some(function (l) { return /cannot hold the Harbinger/.test(l.text); }); });

  // ---------------------------------------------------------------- words for the beats (the numbers are the scene's own)
  function unitName(scn, id) { var u = SN.unit(scn.before, id) || SN.unit(scn.after, id); return u ? (u.party ? 'the four' : u.name) : id; }
  function per(row) { return row[0] > 1 ? row[0] + ' dice a figure' : row[1] > 1 ? '1 die per ' + row[1] + ' figures' : '1 die a figure'; }
  function atkText(scn, b) {
    var row = b.row || SN.CT[b.cls][b.dcls], base = Math.ceil(b.f / row[1]) * row[0], bon = b.bonus || 0;
    return '<p><b>' + esc(unitName(scn, b.u)) + '</b>: ' + b.f + ' figures fighting as <b>' + CN[b.cls] + '</b> against <b>' + CN[b.dcls] + '</b>. The table gives <b>' + per(row) + ', kills on ' + row[2] + (row[2] < 6 ? '-6' : '') + '</b> &rarr; ' + base + ' dice' +
      (b.imp ? ', <b>+' + base + ' for the charge</b> (impetus over open ground)' : '') + (bon ? '; <b>+' + bon + '</b> on every die (' + (bon >= 2 ? 'a super-hero, or berserkers' : 'a hero with them') + '), so kills on <b>' + b.need + '+</b>' : '') + '.</p>' +
      '<p class="num">' + b.dice.length + ' dice: [' + b.dice.join(' ') + '] &rarr; <span class="k">' + b.k + ' kill' + (b.k === 1 ? '' : 's') + '</span></p>';
  }
  function morText(scn, b) {
    var P2 = b.parts; if (!P2) return '';
    function side(nm, a, o) {
      var cas = a.cas < o.cas ? (o.cas - a.cas) + ' fewer casualties &times; a die (' + a.die + ') = ' + (o.cas - a.cas) * a.die : 'no fewer casualties: 0';
      var sv = a.surv > o.surv ? (a.surv - a.surv + a.surv - o.surv) + ' more survivors: +' + (a.surv - o.surv) : 'no more survivors: 0';
      var raw = (a.cas < o.cas ? (o.cas - a.cas) * a.die : 0) + (a.surv > o.surv ? a.surv - o.surv : 0) + a.surv * a.rate;
      return '<p class="num"><b>' + nm + '</b>: ' + cas + '; ' + sv + '; ' + a.surv + ' survivors &times; morale ' + a.rate + ' = ' + Math.round(a.surv * a.rate * 10) / 10 + ' &rarr; ' + Math.round(raw * 10) / 10 + (b.doubled ? ' &times; 2 = <b>' + Math.round(raw * 2) + '</b>' : ' = <b>' + Math.round(raw) + '</b>') + '</p>';
    }
    var res = { 'continue': 'under 20: the melee goes on', backoff: '20-39: they back off half a move', back: '40-59: they fall back a move in good order', retreat: '60-79: they retreat a move', rout: '80-99: they rout', surrender: '100 or more: they surrender' }[b.how];
    return side('Ours', P2.ours, P2.theirs) + side('Theirs', P2.theirs, P2.ours) + '<p>The gap is <b>' + b.gap + '</b> &rarr; ' + (b.never ? 'the lower side never checks morale, so the melee goes on' : '<b>' + res + '</b>' + (b.how !== 'continue' ? ' (' + (b.lo === 'ours' ? 'ours' : 'theirs') + ')' : '')) + '.</p>';
  }

  // ---------------------------------------------------------------- the steps (CHAINMAIL with its page, the Snoot mode, and where they differ)
  function box(cls, lab, html) { return '<div class="box ' + cls + '"><div class="lab">' + lab + '</div>' + html + '</div>'; }
  var CM = function (h) { return box('cm', 'Chainmail', h); }, OURS = function (h) { return box('ours', 'The Snoot mode', h); }, DIFF = function (h) { return box('diff', 'Different from Chainmail', h); };
  var full = SN.newGame(1); SN.dawn(full); full.log = [];
  var STEPS = [];
  function step(o) { STEPS.push(o); }

  step({ ch: 'The two clocks', title: 'Two books, two clocks', vis: { map: full, marks: [{ h: [9, 8], c: '#ffd25a', t: 'one hex: about five miles' }] },
    html: '<p>The Chef\'s cobble is two books stacked. <b>OD&amp;D Book III</b> gives the map and the day; <b>CHAINMAIL</b> gives the battle and the morale that makes a Snoot a Snoot.</p>' +
      CM('<p>A tabletop battle: one figure is twenty men, an inch is ten yards, a turn is about a minute of fighting (p.8). Book III adds the wilderness: a hex about five miles across, and a turn is a day (pp.16-17).</p>') +
      OURS('<p>The map is Book III\'s: <b>a hex is five miles and a turn is a day</b>, Day 14 onward. A fight on a hex uses CHAINMAIL\'s melee, up to three rounds in the day, at <b>one man a figure</b>: Book III\'s basic system, "one figure representing one man or creature" (p.25) -- the twenty to a figure is for "battles involving large numbers", and the Snoot\'s are the realm\'s own numbers (Griz\'s ruling, 10-15).</p>') +
      DIFF('<p>There are no inches. Within a hex no one has a range or a frontage: a fight is everyone in the hex against everyone -- but each unit faces a side of its hex, and the side an enemy comes in through is its front, its flank or its rear (Griz\'s ruling 10-15: formations).</p>') });
  step({ ch: 'The two clocks', title: 'Ground and movement', vis: { map: full, marks: [{ h: [4, 3], c: '#c8a060', t: 'hills: 2' }, { h: [8, 4], c: '#e0c890', t: 'road: 1' }, { h: [9, 3], c: '#80b0d0', t: 'no one' }, { h: [8, 1], c: '#c8a060', t: 'gulch: 2' }, { h: [12, 5], c: '#a0c070', t: 'open: 1' }] },
    html: CM('<p>Movement in inches by class: armored foot 6", heavy and light foot 9", heavy horse 12", medium 18", light 24" (p.10). A hill halves movement and forbids a charge; woods, marsh and rough ground the same (p.9). Book III: a man on foot crosses 3 hexes a day.</p>') +
      OURS('<p>Each hex costs to enter: <b>open ground and the road 1, the hills and Web Gulch 2</b>; no one walks on the lake. A unit always takes its first step.</p>') +
      DIFF('<p>The day\'s move is <b>Book III\'s foot (3 hexes) scaled by CHAINMAIL\'s own ratios</b>: armored foot 2, heavy and light foot 3, heavy horse 4, medium 6, light 8. Book III\'s horse would cross ten hexes, most of this map, in a day.</p>') });
  step({ ch: 'Units', title: 'A unit is figures', vis: { map: full, sel: 'patrol', marks: [{ h: [9, 8], c: '#4fb3a0', t: 'Newland\'s road patrol: 5' }] },
    html: CM('<p>A figure is twenty men. A unit\'s figures fight by its <b>troop class</b>: light foot, heavy foot, armored foot, light, medium or heavy horse (pp.14-15). Each class has a <b>morale rating</b>: light foot and levies 4, heavy foot 5, light horse 6, armored foot 7, medium horse 8, heavy horse 9 (pp.15-16).</p>') +
      OURS('<p>Each stack is a unit; its badge is its men, one man a figure. Newland\'s road patrol is <b>mixed</b>, as his word has it: <b>a paladin, twelve heavy foot and four mounted with a supply wagon</b> -- each type rolls its own row, and its morale is reckoned type by type (p.15). Two of ours in one hex can <b>COMBINE</b> into one mixed unit.</p>') +
      DIFF('<p>One man a figure (Griz, 10-15), so nearly every melee is under twenty figures a side and its morale totals double, as the book says of small ones (p.15). Every Newland unit carries a paladin, a cleric or both (Griz\'s ruling).</p>') });
  step({ ch: 'Units', title: 'The forces in the books\' classes', vis: { html: forcesTable() },
    html: CM('<p>OD&amp;D Book II: a gnoll is "similar to a hobgoblin", which CHAINMAIL fields as <b>armored foot attacking and heavy foot defending</b> (p.29), <b>morale +2</b>. Berserkers add 2 to their dice, charge on sight and never stop (p.20). A religious order never surrenders and adds 1 to morale (p.19).</p>') +
      OURS('<p>The table on the left is every unit of the battle as the mode builds it: its class to attack, its class to defend, its figures, its morale and its fantastic figures.</p>') +
      DIFF('<p><b>Ours, not the book\'s:</b> the paladin as a CHAINMAIL Hero; the cleric making a unit a religious order that also mends a figure a day; the plains tribes as berserkers; the Dominion\'s patrol lady as a CHAINMAIL warlock (by the book since 10-15: two Armored Foot, a missile every round, the saves, morale 30, 80 points), her missile\'s hit at this scale ours; the mirror hyenas as giant wolves.</p>') });
  step({ ch: 'Units', title: 'Heroes, super-heroes, wraiths', vis: { map: full, marks: [{ h: [9, 8], c: '#ffd25a', t: 'GreyFang, the four' }, { h: [6, 6], c: '#ff8a7a', t: 'the Harbinger' }] },
    html: CM('<p>A <b>Hero</b> fights as four figures, adds 1 to his unit\'s dice, never checks morale, is the last killed, and dies to regular troops only on four hits at once. A <b>Super-hero</b> is all of that doubled, and every enemy unit his charge reaches checks morale (p.30). A <b>Wraith</b> raises its friends\' morale, makes the enemy check, and is harmed only by magic or the fantastic (pp.33-34). Fantastic against fantastic goes on the <b>Fantasy Combat Table</b>, two dice against a number (p.44). Book I keys every class by level to a CHAINMAIL type (p.17): a 4th-level fighter is a Hero, an 8th-level one a Super-hero; an 8th-level magic-user is the Warlock and fights as a Hero.</p>') +
      OURS('<p><b>GreyFang</b> (ranger 11) is a Super-hero. <b>The four</b>, if they were on the tables, are keyed by Book I (the last chapter): Barley and Lymen Super-heroes, Aurdin a Warlock who fights as a Hero, Vivian a Hero. <b>The Harbinger</b> is a Wraith. The paladins are Heroes, and the warlocks are wizards two ranks down (p.30).</p>') +
      DIFF('<p>The four never fight on the tables: their fights go to the DEEP16 grid (the last chapter shows both ways). GreyFang can\'t die except to the Harbinger, and the Harbinger can\'t die at all: put down, the mirror carries him home for two days.</p>') });
  step({ ch: 'The day', title: 'Written orders', vis: { map: A ? A.before : full, sel: 'patrol' },
    html: CM('<p>The <b>simultaneous</b> system: both sides write orders for every unit, then everyone moves half, contacts are checked, the rest of the move is made, and then come missiles and melee (p.9). "Charge if charged" lets a unit move up to support (p.9), and a unit near a melee may be drawn into it (p.16).</p>') +
      OURS('<p>The player writes an order for every unit (<b>march</b>, <b>hold</b> or <b>charge if charged</b>) and the AI writes the gnolls\' and the Dominion\'s in secret. Here the patrol is ordered up the road onto a Skull-Gate band.</p>') +
      '<div class="box ours"><div class="lab">The march\'s pop-up</div>' + previewHtml() + '</div>' });
  step({ ch: 'The day', title: 'Everyone moves at once', vis: { anim: A },
    html: CM('<p>Move half, check for contact, then the rest (p.9).</p>') +
      OURS('<p>Every step happens at its own hour of the day: the sum of its costs over the unit\'s move. The fast arrive first. A step into an enemy\'s hex stops <b>both</b> there: that is a contact, and a fight on that hex.</p>') +
      DIFF('<p>CHAINMAIL\'s half-move check, made finer: every step is its own moment. Moving next to an enemy doesn\'t stop anyone, because hexes have no zone of control.</p>') });
  step({ ch: 'The day', title: 'Formation and facing', vis: { map: A ? A.before : full, sel: 'patrol' },
    html: CM('<p>Every unit is in a formation -- <b>line</b>, <b>column</b> or <b>square</b> (foot only) -- and faces a way; changing either costs movement, and a unit caught in melee while changing is flanked (p.10). Attacked from the <b>flank</b>, it fights the attacker at "the next higher class, i.e., Heavy Foot equals Armored Foot and Heavy Horse equals +1 on each die"; from the <b>rear</b>, the same, and the attacker takes no casualties in return (p.16).</p>') +

  function partySteps() {
    if (!P) return;
    var sh = P.shows.filter(function (s) { return s.first && s.first.t === 'fight'; })[0], gk = SN.unit(P.before, 'gk1'), band = SN.band(P.before, [gk], [8, 6]);

      html: CM('<p>Book III: in a big battle at 20:1, "single fantastic types" fight separately at 1:1 or against a single 20:1 figure (p.25). Book I keys a character to a CHAINMAIL type by class and level, its <b>Fighting Capability</b> (p.17): a Fighting-Man of 8th level is the <b>Superhero</b>; a Magic-User of 8th is the <b>Warlock</b>, who fights as a <b>Hero</b>.</p><p>A Super-hero fights as eight figures and a Hero as four; with a super-hero in it the unit adds <b>+2 to every die</b>; none of them checks morale; regular troops kill a Hero only on four hits at once and a Super-hero only on eight; a super-hero\'s charge makes the enemy check (p.30). A Warlock throws a missile, a fire ball or a lightning bolt (p.31).</p>') + keysTable() +
        OURS('<p><b>Griz\'s ruling (10-15): the four keyed by Book I.</b> On the tables they are <b>' + KEYFIGS + ' figures</b>, +2 a die, and Aurdin\'s fire ball every round. The next steps run that same fight <b>the book\'s way</b>, with the mode\'s own engine and the four as a CHAINMAIL unit. After it comes what the grid does instead.</p>') +
        DIFF('<p>Two readings are the seat\'s: Lymen the paladin keyed as the fighter he is, and Aurdin fighting as Book I\'s Hero while keeping CHAINMAIL\'s Warlock missile.</p>') });
    if (sh) sh.segs.forEach(function (sg, k) {

      else if (b.t === 'atk') { t2 = 'The four on the tables: the dice'; html = list.map(function (x) { return atkText(P, x); }).join('') + CM('<p>Barley and Lymen fight as eight figures each, Aurdin and Vivian as four: ' + KEYFIGS + ', and +2 a die for the super-heroes with them (p.30). Regular troops kill a Hero only with <b>four hits at once</b> and a Super-hero only with <b>eight</b>: Aurdin and Vivian are the ones the band can reach.</p>'); }

      else return;

        '<p>Then it comes back to the map. <b>Won</b>: the band loses figures by the share of the band that fell (halved, unless it never checks morale) and <b>routs</b>. <b>Got out</b> (LEAVE THE FIGHT): the four fall back a hex and the gnolls have won, so the witness fills them. <b>Went down</b>: carried to the Pit, out until tomorrow, and the gnolls have won. Their HP, spell slots and potions stay spent; a day held in the Pit without a fight is a long rest.</p>') +
