     Deepholm's end at the foot); the fourth day to the door rides at the foot of page three. Every marker is an existing 8-bit location --
     a trigger, an npc, a sign or a warp read off content/maps/highway_*.json -- with the scene the game plays there now (js/deep.js) and the
     fight it hands to DEEP16 (deep16/data/fights.js, the ladder's name and level). The random tables are content/encounters.json verbatim.

function esc(s) { return s; } // the strings above carry their own markup
function tagOf(t) { return t ? '<span class="tag ' + t + '">' + ({ ruled:'ruled 10-14', note:'his note, unruled', open:'open', seat:'the seat\'s' }[t] || t) + '</span>' : ''; }

  }).join('<br>') + '</div>';
}
function markCard(m) {
  return '<div class="mk ' + m.side + (m.cls ? ' ' + m.cls : '') + '"><span class="pin"></span><div class="card">' +

    '<p class="now">' + m.now + '</p>' + (m.fight ? '<p class="fight">' + m.fight + '</p>' : '') +
    (m.story ? storyBlock(m.story) : '') + '<div class="rc">' + m.rc + '</div></div></div>';
}

    '<table class="rand">' + r.g.map(function (g) { return '<tr><td class="w">w' + g[0] + '</td><td>' + g[1] + '</td></tr>'; }).join('') + '</table>' +
    '<p class="small">guests weigh the fights: Pyro 1.5, Brann and Hedda 1, Ingrith and a trooper 0.5 -- a road group grows by (4 + weight) / 4 (<code>EV.pickGroup</code>).</p></div>';
}

  h += '</div></div>';
  return h;
}

function framePage(L) {

// the frame wants plot-map.html beside this file (the dragonsleep-8bit folder, or the Pages site); a copy of this page opened elsewhere
// (a download) has no sibling -- then the live one is framed instead (10-14, his "plot map 404'd")
function loadFrame() {
  var fr = document.getElementById('frame'), note = document.getElementById('framenote'); if (!fr || fr.dataset.done) return; fr.dataset.done = 1;
  function use(src, why) { fr.src = src; note.innerHTML = why + ' -- <a href="' + src + '" target="_blank" rel="noopener">open it on its own</a>.'; }
  var sib = 'plot-map.html';
  if (location.protocol === 'file:') { // no fetch on file:, and a file: frame's document is opaque -- so probe the folder by loading data/data.js (plot-map's own data) as a script:
    var s = document.createElement('script'); s.src = 'data/data.js';            // it loads: we are in dragonsleep-8bit, the sibling is there; it errors: a copy elsewhere
    s.onload = function () { use(sib, 'plot-map.html beside this file'); };
    s.onerror = function () { use(LIVE + sib, 'no plot-map.html beside this copy; the live one from Pages'); };
    document.head.appendChild(s); return;
  }
  fetch(sib, { method: 'HEAD' }).then(function (r) { if (r.ok) use(sib, 'plot-map.html beside this file'); else use(LIVE + sib, 'no plot-map.html here (' + r.status + '); the live one from Pages'); })

}
